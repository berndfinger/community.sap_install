---
- name: Verify that 'node_ip' is set
  ansible.builtin.assert:
    that: not( ( thishost.node_ip is undefined) or ( thishost.node_ip is none) or ( thishost.node_ip | trim == '') )
    fail_msg: |
      FAIL: The IP address of this host not known!
        Configure your managed node accordingly or set one of the following variables:
        - sap_ip
        - sap_maintain_etc_hosts_list, member node_ip

- name: Verify that 'node_ip' is using the correct IP address format
  ansible.builtin.assert:
    that:
      - (thishost.node_ip | regex_search(sap_maintain_etc_hosts_regexp_ipv4) is not none
          and thishost.node_ip | regex_search(sap_maintain_etc_hosts_regexp_ipv4) | length > 0)
        or (thishost.node_ip | regex_search(sap_maintain_etc_hosts_regexp_ipv6) is not none
          and thishost.node_ip | regex_search(sap_maintain_etc_hosts_regexp_ipv6) | length > 0)
    fail_msg: |
      FAIL: The IP address of this host does not have a correct format!
        Configure the IP address appropriately in of the following variables:
        - sap_ip
        - sap_maintain_etc_hosts_list, member node_ip

- name: Verify that 'node_name' is set
  ansible.builtin.assert:
    that: not( ( thishost.node_name is undefined) or ( thishost.node_name is none) or ( thishost.node_name | trim == '') )
    fail_msg: |
      FAIL: The hostname of this host is not known!
        Configure your managed node accordingly or set one of the following variables:
        - sap_hostname
        - sap_maintain_etc_hosts_list, member node_name

- name: Set the variable for the DNS domain
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_domain:
      "{{ thishost.node_domain if thishost.node_domain is defined and thishost.node_domain != ''
        else (sap_domain if sap_domain is defined and sap_domain != '' else ansible_facts['domain'] | d('')) }}"

- name: Verify that the DNS domain ist set
  ansible.builtin.assert:
    that: >
      not( ( __sap_maintain_etc_hosts_fact_domain is undefined) or
      ( __sap_maintain_etc_hosts_fact_domain is none) or
      ( __sap_maintain_etc_hosts_fact_domain | trim == '') )
    fail_msg: |
      FAIL: The DNS domain of this host not known!
        Configure your DNS accordingly or set one of the following variables:
        - sap_domain
        - sap_maintain_etc_hosts_list, member node_domain

- name: Set default values for comments and alias mode
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_comment: "{{ (thishost.node_comment | d('') + ' ' + thishost.hana_site | d('')) | trim }}"
    __sap_maintain_etc_hosts_fact_alias_mode: "{{ thishost.alias_mode | default('merge') }}"

- name: Prepend Hashtag to comment
  when: __sap_maintain_etc_hosts_fact_comment | length > 0
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_comment: "# {{ __sap_maintain_etc_hosts_fact_comment }}"

- name: Preserve existing comment if no new comment is provided
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_comment:
      "{{ (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
        | select('match', '^' ~ thishost.node_ip ~ '\\s')
        | map('regex_search', '#.*$')
        | select('string') | first | d('') | trim }}"
  when: thishost.node_comment is undefined or thishost.node_comment == 'managed by Ansible role sap_maintain_etc_hosts'

- name: Merge existing aliases with new alias list
  when: __sap_maintain_etc_hosts_fact_alias_mode != "overwrite"
  block:
    - name: Extract existing aliases from /etc/hosts for {{ thishost.node_ip }}
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_existing_aliases:
          "{{ (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
            | select('match', '^' ~ thishost.node_ip ~ '\\s')
            | map('regex_replace', '#.*$', '')
            | map('split') | flatten
            | reject('equalto', thishost.node_ip)
            | reject('equalto', thishost.node_name)
            | reject('equalto', thishost.node_name ~ '.' ~ __sap_maintain_etc_hosts_fact_domain) }}"

    - name: Add defined aliases
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_aliases:
          "{{ (__sap_maintain_etc_hosts_fact_existing_aliases + thishost.aliases
            | d([])) | unique | join(' ') | trim }}"

- name: Overwrite existing aliases
  when: __sap_maintain_etc_hosts_fact_alias_mode == "overwrite"
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_aliases: "{{ thishost.node_aliases | d([]) | unique | join(' ') }}"

- name: Display host, DNS domainname and IP address before the modification
  ansible.builtin.debug:
    msg:
      - "hostname   = '{{ thishost.node_name }}'"
      - "domain     = '{{ __sap_maintain_etc_hosts_fact_domain }}'"
      - "ip         = '{{ thishost.node_ip }}'"
      - "comment    = '{{ __sap_maintain_etc_hosts_fact_comment }}'"
      - "aliases    = '{{ __sap_maintain_etc_hosts_fact_aliases }}'"
      - "alias mode = '{{ __sap_maintain_etc_hosts_fact_alias_mode }}'"

# We allow more than one line containing sap_ip:
- name: Count entries for {{ thishost.node_ip }}
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_ip_count:
      "{{ (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
        | select('match', '^' ~ (thishost.node_ip | regex_escape) ~ '\\s')
        | list | length }}"
  when: not ansible_check_mode

- name: Report if there is more than one line with the IP address
  ansible.builtin.debug:
    msg:
      - "INFO: More than one line containing '{{ thishost.node_ip }}'. File {{ __sap_maintain_etc_hosts_file }} will not be modified."
  when:
    - not ansible_check_mode
    - __sap_maintain_etc_hosts_fact_ip_count | int > 1

- name: Ensure that node_name is not part of the localhost entry
  ansible.builtin.replace:
    path: "{{ __sap_maintain_etc_hosts_file }}"
    regexp: '^(127.0.0.1 .*)\s{{ line_item }}(\s.*)$'
    replace: '\1\2'
    backup: true
  when:
    - not ansible_check_mode
    - __sap_maintain_etc_hosts_fact_ip_count | int <= 1
  become_user: root
  become: true
  loop:
    - "{{ thishost.node_name }}.{{ __sap_maintain_etc_hosts_fact_domain }}"
    - "{{ thishost.node_name }}"
  loop_control:
    loop_var: line_item

- name: Ensure that the entry for node_ip in {{ __sap_maintain_etc_hosts_file }} is correct
  ansible.builtin.lineinfile:
    path: "{{ __sap_maintain_etc_hosts_file }}"
    regexp: '^{{ thishost.node_ip }}\s'
    line: "{{ thishost.node_ip }} {{ thishost.node_name }}.{{ __sap_maintain_etc_hosts_fact_domain }} {{ thishost.node_name }} {{ __sap_maintain_etc_hosts_fact_aliases }} {{ __sap_maintain_etc_hosts_fact_comment }}"
    backup: true
  when:
    - not ansible_check_mode
    - __sap_maintain_etc_hosts_fact_ip_count | int <= 1
  become_user: root
  become: true

# After all nodes are added or deleted, run the consistency check against the hosts file
- name: Check for duplicate or missing entries of hostname and fqdn in {{ __sap_maintain_etc_hosts_file }}
  ansible.builtin.assert:
    that: (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
        | reject('match', '^#')
        | select('search', '\\s' ~ __sap_maintain_etc_hosts_line_item ~ '(\\s|$)')
        | length == 1
    fail_msg: "FAIL: Hostname or FQDN '{{ __sap_maintain_etc_hosts_line_item }}' is not exactly once in {{ __sap_maintain_etc_hosts_file }}!"
    success_msg: "PASS: Hostname or FQDN '{{ __sap_maintain_etc_hosts_line_item }}' exists exactly once."
  loop:
    - "{{ thishost.node_name }}.{{ __sap_maintain_etc_hosts_fact_domain }}"
    - "{{ thishost.node_name }}"
  loop_control:
    loop_var: __sap_maintain_etc_hosts_line_item
  when: not ansible_check_mode

- name: Perform the hosts file completeness check
  ansible.builtin.set_fact:
    __sap_maintain_etc_hosts_fact_completeness_count:
      "{{ (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
        | reject('match', '^\\s*#')
        | select('search', thishost.node_ip)
        | select('search', thishost.node_name ~ '.' ~ __sap_maintain_etc_hosts_fact_domain)
        | select('search', '\\s' ~ thishost.node_name ~ '(\\s|$)')
        | length }}"

- name: Verify completeness of hosts file entry
  ansible.builtin.assert:
    that:
      - __sap_maintain_etc_hosts_fact_completeness_count | int == 1
    fail_msg: |
      FAIL: Your server's ip4 address, FQDN, or hostname are not in {{ __sap_maintain_etc_hosts_file }}!
        Expected:
      {{ thishost.node_ip }} {{ thishost.node_name }}.{{ __sap_maintain_etc_hosts_fact_domain }} {{ thishost.node_name }}
    success_msg: "All required entries (IP, FQDN, hostname) found exactly once in {{ __sap_maintain_etc_hosts_file }}."
  ignore_errors: "{{ ansible_check_mode }}"

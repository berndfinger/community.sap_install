---
- name: Hosts File - Ensure required defaults are read from setup module
  when: >
    not ((ansible_facts['hostname'] is defined) and
    (ansible_facts['domain'] is defined) and
    (ansible_facts['default_ipv4'] is defined))
  ## this is equivalent to
  # (ansible_facts['hostname'] is undefined) or
  # (ansible_facts['domain'] is undefined) or
  # (ansible_facts['default_ipv4'] is defined)
  ansible.builtin.setup:
    gather_subset: "{{ __sap_maintain_etc_hosts_gather_subset }}"
    filter:
      - "ansible_facts['hostname']"
      - "ansible_facts['domain']"
      - "ansible_facts['default_ipv4']"

- name: Hosts File - Get the content of {{ __sap_maintain_etc_hosts_file }}
  ansible.builtin.slurp:
    src: "{{ __sap_maintain_etc_hosts_file }}"
  register: __sap_maintain_etc_hosts_register_file

- name: Hosts File - Ensure sap_maintain_etc_hosts_list is correctly defined
  when: sap_maintain_etc_hosts_list is defined and sap_maintain_etc_hosts_list | length > 0
  block:
    - name: Hosts File - Ensure 'node_ip' elements are unique
      ansible.builtin.assert:
        that: __defined_node_ips | length == __defined_node_ips | unique | length
        fail_msg: |
          FAIL: Duplicate 'node_ip' values found:
          {% for __node_ip in __defined_node_ips | unique %}
            {% if __defined_node_ips | select('equalto', __node_ip) | list | length > 1 %}
            - {{ __node_ip }} (appears {{ __defined_node_ips | select('equalto', __node_ip) | list | length }} times)
            {% endif %}
          {% endfor %}
      vars:
        __defined_node_ips: "{{ sap_maintain_etc_hosts_list | map(attribute='node_ip', default='') | select | list }}"

    - name: Hosts File - Ensure 'node_name' elements do not contain a dot
      ansible.builtin.assert:
        that: "'.' not in __hosts_item.node_name"
        fail_msg: |
          FAIL: node_name '{{ __hosts_item.node_name }}' contains a dot, which is not allowed!"
      loop: "{{ sap_maintain_etc_hosts_list }}"
      loop_control:
        loop_var: __hosts_item
      when: __hosts_item.node_name is defined

    - name: Hosts File - Ensure 'node_name' elements are unique
      ansible.builtin.assert:
        that: __defined_node_names | length == __defined_node_names | unique | length
        fail_msg: |
          FAIL: Duplicate 'node_name' values found:
          {% for __node_name in __defined_node_names | unique %}
            {% if __defined_node_names | select('equalto', __node_name) | list | length > 1 %}
            - {{ __node_name }} (appears {{ __defined_node_names | select('equalto', __node_name) | list | length }} times)
            {% endif %}
          {% endfor %}
      vars:
        __defined_node_names: "{{ sap_maintain_etc_hosts_list
                                | map(attribute='node_name', default='')
                                | select | list }}"

    - name: Hosts File - Ensure 'aliases' elements are unique
      ansible.builtin.assert:
        that: __defined_aliases | length == __defined_aliases | unique | length
        fail_msg: |
          FAIL: Duplicate 'aliases' values found:
          {% for __aliases in __defined_aliases | unique %}
            {% if __defined_aliases | select('equalto', __aliases) | list | length > 1 %}
            - {{ __aliases }} (appears {{ __defined_aliases | select('equalto', __aliases) | list | length }} times)
            {% endif %}
          {% endfor %}
      vars:
        __defined_aliases: "{{ sap_maintain_etc_hosts_list
                             | map(attribute='aliases', default='')
                             | select | flatten }}"

    # The next four tasks ensure that for a host to be present, no host name is defined in sap_maintain_etc_hosts_list
    # for which a different IP address is already present in /etc/hosts
    - name: Hosts File - Assign {{ __sap_maintain_etc_hosts_file }} entries to intermediate variable
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_hosts_intermediate:
          "{{
            (__sap_maintain_etc_hosts_register_file.content | b64decode).split('\n')
            | reject('search', '^\\s*$')
            | reject('search', '^\\s*#')
            | map('regex_replace', '\\s*#.*$', '')
            | map('trim')
            | select('match', '^[0-9]')
            | map('split')
            | list
          }}"

    - name: Hosts File - Create a list of host names and their IP addresses
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_ip_hosts_list: >-
          {%- set result = [] -%}
          {%- for parts in __sap_maintain_etc_hosts_fact_hosts_intermediate -%}
            {%- if parts | length > 1 -%}
              {%- for hostname in parts[1:] -%}
                {%- set _ = result.append({'ip': parts[0], 'hostname': hostname}) -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Hosts File - Identify IP address mismatches of hostnames between sap_maintain_etc_hosts_list and {{ __sap_maintain_etc_hosts_file }} entries
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_ip_mismatches_hostnames: >-
          {%- set mismatches = [] -%}
          {%- for __node in sap_maintain_etc_hosts_list -%}
            {%- if (__node.state is not defined or __node.state == 'present') and __node.node_name is defined -%}
              {%- set matching_hosts = [] -%}
              {%- for __host in __sap_maintain_etc_hosts_fact_ip_hosts_list -%}
                {%- if (__host.state is not defined or __host.state == 'present') and __host.hostname == __node.node_name -%}
                  {%- set _ = matching_hosts.append(__host) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for __host in matching_hosts -%}
                {%- if __host.ip != __node.node_ip -%}
                  {%- set _ = mismatches.append({
                    'hostname': __node.node_name,
                    'defined_ip': __node.node_ip,
                    'actual_ip': __host.ip
                  }) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ mismatches }}

    - name: Hosts File - Assert that there are no IP address mismatches for hostnames
      ansible.builtin.assert:
        that: __sap_maintain_etc_hosts_fact_ip_mismatches_hostnames | length == 0
        fail_msg: "FAIL: IP address mismatches found: {{ __sap_maintain_etc_hosts_fact_ip_mismatches_hostnames }}"
        success_msg: "PASS: All IP addresses match correctly for hostnames"

    - name: Hosts File - Identify IP address mismatches of FQDNs between sap_maintain_etc_hosts_list and {{ __sap_maintain_etc_hosts_file }} entries
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_ip_mismatches_fqdn: >-
          {%- set mismatches_fqdn = [] -%}
          {%- for __node in sap_maintain_etc_hosts_list -%}
            {%- if (__node.state is not defined or __node.state == 'present') and __node.node_name is defined -%}
              {%- set matching_fqdn = [] -%}
              {%- for __host in __sap_maintain_etc_hosts_fact_ip_hosts_list -%}
                {%- if (__host.state is not defined or __host.state == 'present') and __host.hostname == (__node.node_name ~ '.' ~  __node.node_domain | d(sap_domain) | d(ansible_facts['domain']) ) -%}
                  {%- set _ = matching_fqdn.append(__host) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for __host in matching_fqdn -%}
                {%- if __host.ip != __node.node_ip -%}
                  {%- set _ = mismatches_fqdn.append({
                    'hostname': __node.node_name + "." + __node.node_domain,
                    'defined_ip': __node.node_ip,
                    'actual_ip': __host.ip
                  }) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ mismatches_fqdn }}

    - name: Hosts File - Assert that there are no IP address mismatches for FQDNs
      ansible.builtin.assert:
        that: __sap_maintain_etc_hosts_fact_ip_mismatches_fqdn | length == 0
        fail_msg: "FAIL: IP address mismatches found: {{ __sap_maintain_etc_hosts_fact_ip_mismatches_fqdn }}"
        success_msg: "PASS: All IP addresses match correctly for FQDNs"

    - name: Hosts File - Assert that either 'node_ip' or 'node_name' is defined for hosts with state='absent'
      ansible.builtin.assert:
        that: __absent_item.node_ip is defined or __absent_item.node_name is defined
        fail_msg: "FAIL: member with state 'absent' is defined without 'node_ip' or 'node_name': {{ __absent_item }}."
      loop: "{{ sap_maintain_etc_hosts_list | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') }}"
      loop_control:
        loop_var: __absent_item

    - name: Hosts File - Get list of hosts to be present with no state definition
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_present: "{{ sap_maintain_etc_hosts_list | selectattr('state', 'undefined') | list }}"

    - name: Hosts File - Add list of hosts with state=present
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_present:
          "{{ __sap_maintain_etc_hosts_fact_present
           + (sap_maintain_etc_hosts_list
             | difference(__sap_maintain_etc_hosts_fact_present)
             | selectattr('state', 'eq', 'present') | list)
           }}"

    - name: Hosts File - Display all hosts to be present
      ansible.builtin.debug:
        msg:
          - "{{ __sap_maintain_etc_hosts_fact_present }}"
        verbosity: 2

    - name: Hosts File - Identify duplicate hostnames or aliases among sap_maintain_etc_hosts_list and {{ __sap_maintain_etc_hosts_file }}
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_duplicate_hostnames: >-
          {%- set duplicates = [] -%}
          {%- for __host in __sap_maintain_etc_hosts_fact_present -%}
            {%- set __configured_hostnames = [__host.node_name] -%}
            {%- if __host.aliases is defined and __host.aliases is not none and __host.aliases | length > 0 -%}
              {%- set _ = __configured_hostnames.extend(__host.aliases) -%}
            {%- endif -%}
            {%- for __hostname in __configured_hostnames -%}
              {%- set existing = __sap_maintain_etc_hosts_fact_ip_hosts_list | selectattr('hostname', 'eq', __hostname) | list -%}
              {%- if existing | length > 0 -%}
                {%- for entry in existing -%}
                  {%- if entry.ip != __host.node_ip and __hostname not in duplicates -%}
                    {%- set _ = duplicates.append(__hostname) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ duplicates }}

    - name: Hosts File - Assert that hostnames and aliases are unique
      ansible.builtin.assert:
        that: "__sap_maintain_etc_hosts_fact_duplicate_hostnames | length == 0"
        fail_msg: "FAIL: Duplicate hostnames or aliases found in sap_maintain_etc_hosts_list or {{ __sap_maintain_etc_hosts_file }}: {{ __sap_maintain_etc_hosts_fact_duplicate_hostnames | join(', ') }}"
        success_msg: "PASS: All hostnames, including aliases, of sap_maintain_etc_hosts_list are unique, also among {{ __sap_maintain_etc_hosts_file }}"

    - name: Hosts File - Ensure 'node_ip' and 'node_name' are defined for hosts to be added
      ansible.builtin.assert:
        that:
          - __present_item.node_ip is defined
          - __present_item.node_name is defined
        fail_msg: "FAIL: member with state != 'absent' is defined without 'node_ip' or 'node_name': {{ __present_item }}."
      loop: "{{ __sap_maintain_etc_hosts_fact_present }}"
      loop_control:
        loop_var: __present_item

    - name: Hosts File - Extract IP addresses and comments from hosts file
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_ip_comments_list: >-
          {%- set result = [] -%}
          {%- for line in (__sap_maintain_etc_hosts_register_file.content | b64decode).split('\n') -%}
            {%- if line | regex_search('^\\s*[0-9]') -%}
              {%- set ip = line | regex_replace('^\\s*([0-9.]+).*$', '\\1') -%}
              {%- set comment = line | regex_replace('^.*#\\s*(.*)$', '\\1') if '#' in line else '' -%}
              {%- set _ = result.append({'ip': ip, 'comment': comment}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Hosts File - Set hosts list variable from sap_maintain_etc_hosts_list with existing comments
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_hosts_list: >-
          {%- set result = [] -%}
          {%- for __host in __sap_maintain_etc_hosts_fact_present -%}
            {%- set host_copy = __host.copy() -%}
            {%- if __host.node_comment is not defined or __host.node_comment | length == 0 -%}
              {%- set existing_comment = (__sap_maintain_etc_hosts_fact_ip_comments_list
              | selectattr('ip', 'equalto', __host.node_ip)
              | map(attribute='comment') | first | default('')) or sap_maintain_etc_hosts_default_comment -%}
              {%- set _ = host_copy.update({'node_comment': existing_comment}) -%}
            {%- endif -%}
            {%- set _ = result.append(host_copy) -%}
          {%- endfor -%}
          {{ result }}

    - name: Hosts File - Add list of hosts with state=absent
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_hosts_list:
          "{{ __sap_maintain_etc_hosts_fact_hosts_list
           + (sap_maintain_etc_hosts_list
             | selectattr('state', 'defined')
             | selectattr('state', 'eq', 'absent') | list)
           }}"

#    - name: Hosts File - Set hosts list variable from sap_maintain_etc_hosts_list
#      ansible.builtin.set_fact:
#        __sap_maintain_etc_hosts_fact_hosts_list: "{{ sap_maintain_etc_hosts_list }}"

# Set defaults for local host if sap_maintain_etc_hosts_list is empty
- name: Hosts File - Set vars if sap_maintain_etc_hosts_list is empty
  when: >
    (sap_maintain_etc_hosts_list is undefined) or
    (sap_maintain_etc_hosts_list is none) or
    (sap_maintain_etc_hosts_list | trim == '') or
    (sap_maintain_etc_hosts_list | length == 0)
  block:
    - name: Hosts File - Preserve existing comment if no new comment is provided
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_comment:
          "{{ (__sap_maintain_etc_hosts_register_file['content'] | b64decode).split('\n')
            | select('match', '^' ~ ansible_facts['default_ipv4'].address ~ '\\s')
            | map('regex_search', '#.*$')
            | select('string')
            | first
            | regex_replace('^# ', '')
            | d('') | trim }}"

    - name: Hosts File - Set hosts list variable to defaults
      ansible.builtin.set_fact:
        __sap_maintain_etc_hosts_fact_hosts_list:
          - node_ip: "{{ ansible_facts['default_ipv4'].address }}"
            node_name: "{{ ansible_facts['hostname'] }}"
            node_domain: "{{ sap_domain | d(ansible_facts['domain']) }}"
            node_comment: "{{ __sap_maintain_etc_hosts_fact_comment
              if __sap_maintain_etc_hosts_fact_comment | length > 0
              else sap_maintain_etc_hosts_default_comment }}"
            state: present

- name: Hosts File - Maintain entries in "{{ __sap_maintain_etc_hosts_file }}"
  ansible.builtin.include_tasks:
    file: update_host_{{ __etc_hosts_item.state | default('present') }}.yml
  loop: "{{ __sap_maintain_etc_hosts_fact_hosts_list }}"
  loop_control:
    label: "{{ __etc_hosts_item.node_name | d(__etc_hosts_item.node_ip) }}"
    loop_var: __etc_hosts_item

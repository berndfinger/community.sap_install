---

# This is pseudo-idempotency validation to ensure that remaining SWPM tasks are skipped if there are running SAP instances detected.
# This is to prevent any potential issues that could arise from running the SWPM installation while SAP instances are active.
# Optional override is available in defaults/main.yml to execute regardless of warning.

# Steps for checking existing SAP instances:
# 0. Prepare lists of instance names and numbers for detection based on provided variables and product catalog ID.
# 1. Check output from /usr/sap/hostctrl/exe/saphostctrl -function ListInstances
# 2. Check contents of /usr/sap/sapservices
# 3. Check contents of /usr/sap/<SID>/ directories
# 4. Check profile files in /sapmnt/<SID>/profile/
# 5. Set boolean flag for skipping further tasks.
# 6. Inform user about detected instances and potential risks of proceeding with installation.


# Extract prefix from Product ID, or inform that prefix is not recognized.
- name: SAP SWPM Pre Install - Set fact with SAP Product ID prefix
  ansible.builtin.set_fact:
    __sap_swpm_fact_product_prefix: >-
      {{ sap_swpm_product_catalog_id.split(':') | first
        if sap_swpm_product_catalog_id | d('') | trim | length > 0 and ':' in sap_swpm_product_catalog_id
        else '' }}

- name: SAP SWPM Pre Install - Detect - Inform if SAP Product ID prefix is unavailable
  ansible.builtin.debug:
    msg: |
      WARN: Unable to extract SAP Product ID prefix for product catalog ID '{{ sap_swpm_product_catalog_id }}'.
      Expected format of product catalog ID is 'PREFIX:REST_OF_ID' (e.g., 'NW_ABAP_ASCS:S4HANA2025.CORE.HDB.ABAP').
      Detection of existing SAP instances will proceed based on contents of 'sap_swpm_inifile_sections_list' variable.

      NOTE: Providing invalid SAP Product ID will most likely lead into failure during SWPM execution.
  when: __sap_swpm_fact_product_prefix | length == 0


# Prepare lists of instance names and numbers for detection.
# Lists based on Product ID.
# Regex is used to remove items with empty values.
- name: SAP SWPM Pre Install - Detect - Set fact with lists for detection using product ID
  ansible.builtin.set_fact:
    __sap_swpm_detect_instance_numbers:
      "{{ __sap_swpm_product_sections_dict[__sap_swpm_fact_product_prefix]['instance_numbers']
        | select('regex', '.+') | unique | list }}"
    __sap_swpm_detect_instance_names:
      "{{ __sap_swpm_product_sections_dict[__sap_swpm_fact_product_prefix]['instance_names']
        | select('regex', '.+') | unique | list }}"
  when:
    - __sap_swpm_fact_product_prefix | trim | length > 0
    - __sap_swpm_product_sections_dict[__sap_swpm_fact_product_prefix] is defined


# Lists based on sections list if Product ID cannot be used.
# NOTE: Defaults before 'unique' do not serve any purpose, because when already validates it,
# but it is required for linting to pass:
# Falling back to Ansible unique filter as Jinja2 one failed: 'sap_swpm_ascs_instance_nr' is undefined
- name: Block to fall back on sections if product ID is not in dictionary
  when:
    - __sap_swpm_fact_product_prefix | trim | length == 0
      or __sap_swpm_fact_product_prefix not in (
        __sap_swpm_product_sections_dict.keys() | list
        + __sap_swpm_product_detection_skipped | dict2items | map(attribute='value') | flatten)
  block:

    - name: SAP SWPM Pre Install - Detect - Set fact with lists for ASCS detection
      ansible.builtin.set_fact:
        __sap_swpm_detect_instance_numbers: >-
          {{ (__sap_swpm_detect_instance_numbers | d([]) + [sap_swpm_ascs_instance_nr | d('')]) | unique }}
        __sap_swpm_detect_instance_names: >-
          {{ (__sap_swpm_detect_instance_names | d([]) + ['ASCS' ~ sap_swpm_ascs_instance_nr]) | d('') | unique }}
      when:
        - sap_swpm_ascs_instance_nr | d('') | length > 0
        - "'nw_config_central_services_abap' in sap_swpm_inifile_sections_list"

    - name: SAP SWPM Pre Install - Detect - Set fact with lists for SCS detection
      ansible.builtin.set_fact:
        __sap_swpm_detect_instance_numbers: >-
          {{ (__sap_swpm_detect_instance_numbers | d([]) + [sap_swpm_java_scs_instance_nr | d('')]) | unique }}
        __sap_swpm_detect_instance_names: >-
          {{ (__sap_swpm_detect_instance_names | d([]) + ['SCS' ~ sap_swpm_java_scs_instance_nr]) | unique }}
      when:
        - sap_swpm_java_scs_instance_nr | d('') | length > 0
        - "'nw_config_central_services_java' in sap_swpm_inifile_sections_list"

    - name: SAP SWPM Pre Install - Detect - Set fact with lists for ERS detection
      ansible.builtin.set_fact:
        __sap_swpm_detect_instance_numbers: >-
          {{ (__sap_swpm_detect_instance_numbers | d([]) + [sap_swpm_ers_instance_nr | d('')]) | unique }}
        __sap_swpm_detect_instance_names: >-
          {{ (__sap_swpm_detect_instance_names | d([]) + ['ERS' ~ sap_swpm_ers_instance_nr]) | unique }}
      when:
        - sap_swpm_ers_instance_nr | d('') | length > 0
        - "'nw_config_ers' in sap_swpm_inifile_sections_list"

    - name: SAP SWPM Pre Install - Detect - Set fact with lists for PAS detection
      ansible.builtin.set_fact:
        __sap_swpm_detect_instance_numbers: >-
          {{ (__sap_swpm_detect_instance_numbers | d([]) + [sap_swpm_pas_instance_nr | d('')]) | unique }}
        __sap_swpm_detect_instance_names: >-
          {{ (__sap_swpm_detect_instance_names | d([]) + __pas_instance_names) | unique }}
      vars:
        __pas_instance_names:
          - "{{ 'D' ~ sap_swpm_pas_instance_nr }}"
          - "{{ 'DVEBMGS' ~ sap_swpm_pas_instance_nr }}"
          - "{{ 'J' ~ sap_swpm_pas_instance_nr }}"
      when:
        - sap_swpm_pas_instance_nr | d('') | length > 0
        - "'nw_config_primary_application_server_instance' in sap_swpm_inifile_sections_list"

    - name: SAP SWPM Pre Install - Detect - Set fact with lists for AAS detection
      ansible.builtin.set_fact:
        __sap_swpm_detect_instance_numbers: >-
          {{ (__sap_swpm_detect_instance_numbers | d([]) + [sap_swpm_aas_instance_nr | d('')]) | unique }}
        __sap_swpm_detect_instance_names: >-
          {{ (__sap_swpm_detect_instance_names | d([]) + __aas_instance_names) | unique }}
      vars:
        __aas_instance_names:
          - "{{ 'D' ~ sap_swpm_aas_instance_nr }}"
          - "{{ 'J' ~ sap_swpm_aas_instance_nr }}"
      when:
        - sap_swpm_aas_instance_nr | d('') | length > 0
        - "'nw_config_additional_application_server_instance' in sap_swpm_inifile_sections_list"


## 1. Check output from /usr/sap/hostctrl/exe/saphostctrl -function ListInstances
- name: Block for saphostctrl checks
  when: __sap_swpm_detect_instance_numbers | d([]) | length > 0
  block:
    - name: SAP SWPM Pre Install - Detect - Stat /usr/sap/hostctrl/exe/saphostctrl file
      ansible.builtin.stat:
        path: /usr/sap/hostctrl/exe/saphostctrl
      register: __sap_swpm_register_saphostctrl_stat

    - name: SAP SWPM Pre Install - Detect - Execute saphostctrl function ListInstances
      ansible.builtin.command:
        cmd: /usr/sap/hostctrl/exe/saphostctrl -function ListInstances
      register: __sap_swpm_register_saphostctrl_listinstances
      ignore_errors: true
      changed_when: false
      when:
        - __sap_swpm_register_saphostctrl_stat.stat.exists
        - __sap_swpm_register_saphostctrl_stat.stat.executable

    # Match pattern: " <SID> - <NR> ".
    # Example: Inst Info : AE1 - 10 - ae1ers-ha - 793, patch 51, commit 375ae433dffb023985041c1d7b4687b1bde8d211
    - name: SAP SWPM Pre Install - Detect - Set fact with matching SAP instances in saphostctrl output
      ansible.builtin.set_fact:
        __sap_swpm_fact_sap_instances_found: >-
          {%- set found = [] -%}
          {%- for line in __sap_swpm_register_saphostctrl_listinstances.stdout_lines | d([]) -%}
            {%- for nr in __sap_swpm_detect_instance_numbers -%}
              {%- if line is search(' ' ~ sap_swpm_sid ~ ' - ' ~ nr ~ ' ') -%}
                {%- set _ = found.append(nr) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ found | unique }}

    - name: SAP SWPM Pre Install - Detect - Inform if SAP instance is already present in saphostctrl
      ansible.builtin.debug:
        msg: >-
          WARN: Existing SAP instances detected in saphostctrl output for {{ sap_swpm_sid }}:
          {{ __sap_swpm_fact_sap_instances_found | join(', ') }}
      when: __sap_swpm_fact_sap_instances_found | length > 0


## 2. Check contents of /usr/sap/sapservices
# This file can be managed by cluster software like Veritas,
# therefore not showing instance if cluster is stopped.
- name: Block for sapservices checks
  when: __sap_swpm_detect_instance_numbers | d([]) | length > 0
  block:
    - name: SAP SWPM Pre Install - Detect - Stat /usr/sap/sapservices file
      ansible.builtin.stat:
        path: /usr/sap/sapservices
      register: __sap_swpm_register_sapservices_stat

    - name: SAP SWPM Pre Install - Detect - Read /usr/sap/sapservices file
      ansible.builtin.slurp:
        path: /usr/sap/sapservices
      register: __sap_swpm_register_sapservices_slurp
      when: __sap_swpm_register_sapservices_stat.stat.exists

    # Match pattern: SAP<SID>_<NR>
    - name: SAP SWPM Pre Install - Detect - Set fact with matching SAP instances in sapservices file
      ansible.builtin.set_fact:
        __sap_swpm_fact_sap_services_found: >-
          {%- set content = (__sap_swpm_register_sapservices_slurp.content | b64decode)
            if __sap_swpm_register_sapservices_slurp.content is defined else '' -%}
          {%- set found = [] -%}
          {%- for line in content.splitlines() -%}
            {%- for nr in __sap_swpm_detect_instance_numbers -%}
              {%- if ('SAP' ~ sap_swpm_sid ~ '_' ~ nr) in line -%}
                {%- set _ = found.append(nr) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ found | unique }}

    - name: SAP SWPM Pre Install - Detect - Inform if SAP instance is already present in sapservices
      ansible.builtin.debug:
        msg: >-
          WARN: Existing SAP instances detected in sapservices file for {{ sap_swpm_sid }}:
          {{ __sap_swpm_fact_sap_services_found | join(', ') }}
      when: __sap_swpm_fact_sap_services_found | length > 0


## 3. Check contents of /usr/sap/<SID>/ directories
- name: Block for directories checks
  when: __sap_swpm_detect_instance_names | d([]) | length > 0
  block:
    - name: SAP SWPM Pre Install - Detect - Stat directory {{ '/usr/sap/' ~ sap_swpm_sid ~ '/' }}
      ansible.builtin.stat:
        path: "{{ '/usr/sap/' ~ sap_swpm_sid ~ '' }}"
      register: __sap_swpm_register_sapmnt_stat

    - name: SAP SWPM Pre Install - Detect - Find instance directories in {{ '/usr/sap/' ~ sap_swpm_sid ~ '/' }}
      ansible.builtin.find:
        paths: "/usr/sap/{{ sap_swpm_sid }}/"
        file_type: directory
        recurse: false
      register: __sap_swpm_register_instance_dirs_find
      when: __sap_swpm_register_sapmnt_stat.stat.exists

    # This task can take longer on installed instances.
    # It took around 1 minute to get 14000 files in S4HANA 2025 PAS instance.
    - name: SAP SWPM Pre Install - Detect - Check for files in matching directories
      ansible.builtin.find:
        paths: "{{ dir_item.path }}"
        file_type: file
        recurse: true
      loop: "{{ __sap_swpm_register_instance_dirs_find.files | d([]) }}"
      loop_control:
        label: "{{ dir_item.path }}"
        loop_var: dir_item
      register: __sap_swpm_register_instance_dirs_content
      when: dir_item.path | basename in __sap_swpm_detect_instance_names

    - name: SAP SWPM Pre Install - Detect - Display status of matching directories
      ansible.builtin.debug:
        msg: >-
          Directory {{ file_item.dir_item.path }} contains {{ file_item.matched }} files.
      loop: "{{ __sap_swpm_register_instance_dirs_content.results }}"
      loop_control:
        label: "{{ file_item.dir_item.path }}"
        loop_var: file_item
      when:
        - file_item.skipped is not defined
        - file_item.matched is defined

    - name: SAP SWPM Pre Install - Detect - Set fact if matching directories with files were found
      ansible.builtin.set_fact:
        __sap_swpm_fact_sap_directories_found: true
      when:
        - __sap_swpm_register_instance_dirs_content.results
            | selectattr('matched', 'defined')
            | selectattr('matched', 'gt', 0)
            | list | length > 0

    - name: SAP SWPM Pre Install - Detect - Inform if SAP instance is already present in directories
      ansible.builtin.debug:
        msg: |
          WARN: Existing SAP instances detected in directories for {{ sap_swpm_sid }}:
          {% for item in __sap_swpm_register_instance_dirs_content.results if item.matched is defined and item.matched > 0 %}
          - Directory '{{ item.dir_item.path }}' contains {{ item.matched }} files.
          {% endfor %}
      when: __sap_swpm_fact_sap_directories_found | d(false)


## 4. Check profile files in /sapmnt/<SID>/profile/
- name: Block for profile files checks
  when: __sap_swpm_detect_instance_names | d([]) | length > 0
  block:
    - name: SAP SWPM Pre Install - Detect - Stat directory {{ '/sapmnt/' ~ sap_swpm_sid ~ '/profile/' }}
      ansible.builtin.stat:
        path: "{{ '/sapmnt/' ~ sap_swpm_sid ~ '/profile/' }}"
      register: __sap_swpm_register_profile_dir_stat

    - name: SAP SWPM Pre Install - Detect - Find profile files in {{ '/sapmnt/' ~ sap_swpm_sid ~ '/profile/' }}
      ansible.builtin.find:
        paths: "/sapmnt/{{ sap_swpm_sid }}/profile/"
        file_type: file
        recurse: false
      register: __sap_swpm_register_profiles_find
      when: __sap_swpm_register_profile_dir_stat.stat.exists

    # Match pattern: <SID>_<INSTANCE>_ (e.g., AE1_ASCS00_)
    - name: SAP SWPM Pre Install - Detect - Set fact with matching SAP instances in profile files
      ansible.builtin.set_fact:
        __sap_swpm_fact_sap_profiles_found: >-
          {%- set found = [] -%}
          {%- for file in __sap_swpm_register_profiles_find.files | d([]) -%}
            {%- for name in __sap_swpm_detect_instance_names -%}
              {%- if (sap_swpm_sid ~ '_' ~ name ~ '_') in file.path | basename -%}
                {%- set _ = found.append(file.path | basename) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ found | unique }}

    - name: SAP SWPM Pre Install - Detect - Inform if SAP instance is already present in profile files
      ansible.builtin.debug:
        msg: |
          WARN: Existing SAP instances detected in profile files for {{ sap_swpm_sid }}:
          {% for profile in __sap_swpm_fact_sap_profiles_found %}
          - {{ profile }}
          {% endfor %}
      when: __sap_swpm_fact_sap_profiles_found | length > 0


- name: SAP SWPM Pre Install - Detect - Set fact if clues to existing SAP instance were found
  ansible.builtin.set_fact:
    __sap_swpm_sap_detected: true
  when:
    - not sap_swpm_force | d(false)
    - __sap_swpm_fact_sap_instances_found | d([]) | length > 0
      or __sap_swpm_fact_sap_services_found | d([]) | length > 0
      or __sap_swpm_fact_sap_profiles_found | d([]) | length > 0
      or __sap_swpm_fact_sap_directories_found | d(false)

# This is very dynamic message that covers all possible scenarios.
- name: SAP SWPM Pre Install - Detect - Inform about next steps if SAP instance was detected
  ansible.builtin.pause:
    seconds: "{{ 30 if not sap_swpm_force | d(false) else 5 }}"
    prompt: |
      WARN: Clues to existing SAP instance(s) were detected for {{ sap_swpm_sid }}.
      Product ID: '{{ sap_swpm_product_catalog_id | d('') }}'

      {% if sap_swpm_force | d(false) %}
      SWPM installation steps will be executed regardless,
      because 'sap_swpm_force' variable is set to 'true' (default is 'false').
      {% else %}
      SWPM installation steps will be skipped to avoid potential issues with existing installation.

      If you intend to proceed with the installation despite this warning,
      set 'sap_swpm_force' variable to 'true' and execute this Ansible Role again.
      {% endif %}

      SAP Instances were detected based on the following checks:
      {% if __sap_swpm_fact_sap_instances_found | d([]) | length > 0 %}
      - Output of '/usr/sap/hostctrl/exe/hostctrl -function ListInstances'.
      {% endif %}
      {% if __sap_swpm_fact_sap_services_found | d([]) | length > 0 %}
      - Contents of '/usr/sap/services' file.
      {% endif %}
      {% if __sap_swpm_fact_sap_profiles_found | d([]) | length > 0 %}
      - Existence of profile files in '/sapmnt/{{ sap_swpm_sid }}/profile/' directory.
      {% endif %}
      {% if __sap_swpm_fact_sap_directories_found | d(false) %}
      - Existence of files in '/usr/sap/{{ sap_swpm_sid }}/' directories.
      {% endif %}
  when: __sap_swpm_sap_detected | d(false)


# We cannot reliably detect some products,
# but we want to inform the user about that fact and potential risks of proceeding without detection.
- name: SAP SWPM Pre Install - Detect - Inform about products with limited detection capabilities
  ansible.builtin.pause:
    seconds: "{{ 30 if not sap_swpm_force | d(false) else 5 }}"
    prompt: |
      WARN: SAP Product {{ sap_swpm_product_catalog_id }} cannot be reliably detected by this role due to its nature.

      {% if __sap_swpm_fact_product_prefix in __sap_swpm_product_detection_skipped['database_load'] %}
      - Database Load does not store any local files that can be detected.
        SWPM handles repeated execution by itself, but you need to proceed with caution when targeting live SAP System.
      {% endif %}
  when:
    - __sap_swpm_fact_product_prefix | d('') | trim | length > 0
    - __sap_swpm_fact_product_prefix
      in __sap_swpm_product_detection_skipped | dict2items | map(attribute='value') | flatten | unique
